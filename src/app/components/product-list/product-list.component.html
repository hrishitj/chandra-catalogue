<div class="d-flex flex-wrap gap-4 justify-content-center justify-content-lg-start container mt-4">
  <div class="card p-3" style="width: 300px;" *ngFor="let product of filteredProducts()">
    <div class="image-container position-relative mb-3">
      <img [src]="product.images[product.currentImageIndex || 0]"
           class="card-img-top"
           [alt]="product.code"
           style="max-height: 200px; object-fit: contain; width: 100%;">
    </div>

    <div class="card-body p-0">
      <h5 class="card-title text-center">{{ product.code }}</h5>
      <p class="text-center">CTW - {{ product.ctw }} CT</p>
      <p class="text-center">MW - 10KT - {{ product.mw?.tenKt }} GMS 14KT - {{ product.mw?.fourteenKt }} GMS</p>

      <!-- Table Header -->
      <table class="table table-bordered text-center align-middle">
        <thead>
          <tr>
            <th></th>
            <th>10K<br>$ {{ product.prices['10K'] || '000' }}</th>
            <th>14K<br>$ {{ product.prices['14K'] || '000' }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let metal of ['W', 'Y', 'R']">
            <td>{{ metal }}</td>
            <td>
              <input type="number" min="0" class="form-control form-control-sm text-center"
                     [(ngModel)]="product.quantities[metal + '_10K']" placeholder="QTY">
            </td>
            <td>
              <input type="number" min="0" class="form-control form-control-sm text-center"
                     [(ngModel)]="product.quantities[metal + '_14K']" placeholder="QTY">
            </td>
          </tr>
        </tbody>
      </table>

      <button class="add-to-cart btn w-100 mt-2" (click)="addToCart(product)">
        Add to Enquiry Cart
      </button>
    </div>
  </div>
</div>
