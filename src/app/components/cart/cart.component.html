<div class="container-fluid mt-4" >
  <h2 class="mb-4">Enquiry Cart</h2>

  <!-- Empty State -->
  <div *ngIf="cartItems.length === 0" class="text-center">
    <p>Your cart is empty.</p>
  </div>

  <!-- Cart Items -->
  <div *ngFor="let item of cartItems; let i = index" class="card mb-3 position-relative">
    <!-- Remove X -->
    <button (click)="removeFromCart(i)" type="button"
            class="btn-close position-absolute top-0 end-0 m-2"
            aria-label="Remove"></button>

    <div class="row g-0 align-items-center w-100"> <!-- Added w-100 here -->
      <!-- Image -->
      <div class="col-md-3 text-center p-2">
        <img [src]="item.image" alt="{{ item.code }}" class="img-fluid" style="max-height: 500px;" />
      </div>

      <!-- Code + Weight -->
      <div class="col-md-3">
        <div class="card-body py-2">
          <h5 class="card-title mb-1">{{ item.code }}</h5>
          <p class="mb-0"><strong>{{ item.weight }}</strong></p>
        </div>
      </div>

      <!-- Selected Items -->
      <div class="col-md-4">
        <div class="card-body py-4">
          <div *ngIf="item.combinations?.length">
            <strong>Selected Combinations:</strong>
            <ul class="list-unstyled mb-2">
              <li *ngFor="let combo of item.combinations">
                {{ combo.metal }} {{ combo.karat }} - Qty: {{ combo.quantity }} - ${{ combo.price }} = ${{ combo.price * combo.quantity }}
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Total -->
      <div class="col-md-2 text-end py-4 pe-4">
        <p class="fw-bold mb-0">Total: ${{ getItemTotal(item) }}</p>
      </div>
    </div>
  </div>

  <!-- Contact Form -->
  <div class="mt-4 py-4">
    <h4>Contact Details</h4>
    <div class="mb-3 col-md-4">
      <input type="text" class="form-control" placeholder="Your Name" [(ngModel)]="name" />
    </div>
    <div class="mb-3 col-md-4">
      <input type="email" class="form-control" placeholder="Your Email" [(ngModel)]="email" />
    </div>
    <button title="Fill in your name and email to send the enquiry" [disabled]="!name || !email" (click)="sendEnquiry()" class="add-to-cart col-md-2 btn">
      Send Enquiry
    </button>
  </div>
</div>
